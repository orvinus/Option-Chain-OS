services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      # Set POSTGRES_PASSWORD in the repo-root .env. The old hardcoded "postgres"
      # default is a superuser credential, and a Postgres superuser can run
      # COPY ... TO PROGRAM — i.e. arbitrary commands on the host.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: oi
    ports:
      # Bound to LOCALHOST ONLY. The backend reaches the DB over the internal compose
      # network (host "timescaledb"), so nothing needs this published externally.
      # Publishing it as "5432:5432" exposed the database to the whole internet.
      - "127.0.0.1:5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    env_file:
      - ../.env
    environment:
      DB_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@timescaledb:5432/oi
      DB_URL_SYNC: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@timescaledb:5432/oi
      # Override in repo-root `.env` for VPS (e.g. http://203.0.113.10,https://oi.example.com).
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost,http://127.0.0.1}
    depends_on:
      timescaledb:
        condition: service_healthy
    ports:
      # Bound to LOCALHOST ONLY. The frontend container proxies /api and /ws to
      # "backend:8000" over the internal network, so this never needs to be public.
      # Published externally it let anyone read every endpoint and hammer
      # /api/auth/login, completely bypassing the dashboard password gate.
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    depends_on:
      - backend
    ports:
      # Where the SPA is published on the host. Default is the public :80 for a
      # standalone box. A host already running its own reverse proxy on 80/443 must
      # NOT also bind :80 here — set FRONTEND_BIND=127.0.0.1:8080 in .env instead.
      # Configurable on purpose: editing this file on a server makes every future
      # `git pull` abort with "your local changes would be overwritten".
      - "${FRONTEND_BIND:-0.0.0.0:80}:80"
    restart: unless-stopped

volumes:
  timescale_data:
