[project]
name = "nifty-oi-analytics"
version = "1.0.0"
description = "Production-grade NIFTY OI Change Analytics platform"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
